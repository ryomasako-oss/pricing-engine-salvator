name = "halokantor-pricing"
compatibility_date = "2025-01-01"
main = "server/worker/index.ts"

[[d1_databases]]
binding = "DB"
database_name = "halokantor-pricing"
database_id = "d1d9be2b-db8b-4b76-84b8-dba6807e7e3d"
migrations_dir = "migrations"

[assets]
directory = "./dist/client"
not_found_handling = "single-page-application"
binding = "ASSETS"
# Every request is routed through the Worker first (not just /api/*) so that
# secureHeaders (CSP, HSTS, X-Frame-Options, X-Content-Type-Options) applies
# to the HTML/JS/CSS the browser actually loads, not only to JSON API
# responses. Non-API requests fall through to ASSETS.fetch() in index.ts.
run_worker_first = true

# Accurate Online sync: every tick advances the resumable cursor by at most
# ACCURATE_CALLS_PER_TICK calls; a new full run starts every
# ACCURATE_SYNC_EVERY_HOURS. Secrets (never commit them):
#   wrangler secret put ACCURATE_SIGNATURE_SECRET
#   wrangler secret put ACCURATE_TOKEN_CV
#   wrangler secret put ACCURATE_TOKEN_PT
[triggers]
# 1) Accurate sync tick. 2) 08:00 WIB "Perlu diperbaiki" email
#    (server/worker/fixDigest.ts DIGEST_CRON). 3) Accurate goods receipts for
#    COGS = harga pembelian terakhir (server/worker/accurate/receipts.ts
#    RECEIPTS_CRON, a no-op until ACCURATE_RECEIPTS_ENABLED = "true").
#    Workers Paid: 250 cron triggers per account (Free: 5).
crons = ["*/5 * * * *", "0 1 * * *", "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"]

[vars]
NODE_ENV = "production"
APP_URL = "https://pricing.salvator.co.id"
ACCURATE_PAGE_SIZE = "100"
# Workers Paid (since 2026-10): 10,000 subrequests and 1,000 D1 queries per
# invocation (accurate.test.ts and receipts.test.ts check every tick stays
# under them). What binds is Accurate's 8 calls/second per token and the 25 s
# tick deadline: 60 calls at the client's 130 ms spacing take about 10-20 s.
ACCURATE_CALLS_PER_TICK = "60"
# Only this Data Usaha is applied to the catalog (Ryoma, 2026-10-06); the
# other is synced, if it has a token, for the cross-entity checks only.
ACCURATE_CATALOG_ENTITY = "PT"
ACCURATE_SYNC_EVERY_HOURS = "6"
# Items new in Accurate are added to the catalog after each completed run
# (COGS 0, so held on quotes until a manager applies one). Existing items
# still change only through "Terapkan". Set "false" to stop.
ACCURATE_AUTO_NEW_ITEMS = "true"
# Goods receipts → COGS = harga pembelian terakhir. Verified on PT
# 2026-10-15 with GET /api/accurate/probe: RI.2026.05.00210 gives 101311 at
# 11.005.000 (= Mutasi), and the lastUpdate filter narrows 7.469 receipts to
# the ~50 changed in a day. First pass reads receipts dated on/after
# ACCURATE_RECEIPTS_SINCE. Set "false" to stop.
ACCURATE_RECEIPTS_ENABLED = "true"
# ACCURATE_RECEIPTS_SINCE is how far back the FIRST pass reads, by transaction
# date; left unset, it is one year. A year gave 3.231 receipts and left 3.749
# catalog items without a purchase price, but 98% of those hold no stock in
# Accurate either, so they are dormant rather than missed. Ryoma decided on
# 2026-10-16 not to widen it: older receipts would only describe items that
# are no longer traded. Note for whoever widens it later — the value alone
# does nothing once a first pass has finished, because the cursor then
# filters by lastUpdate; clear accurate_receipt_state.since_update too.

# Brute-force protection: Workers isolates have no shared in-memory counter,
# so login/password attempts and the AI assistant are throttled through
# Cloudflare's edge-native Rate Limiting binding.
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "ASSISTANT_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# Blanket throttle for the whole /api/* surface, keyed per client IP, so an
# authenticated-but-abusive or compromised account can't hammer D1 unchecked.
[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1003"
simple = { limit = 600, period = 60 }
