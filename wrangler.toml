name = "halokantor-pricing"
compatibility_date = "2025-01-01"
main = "server/worker/index.ts"

[[d1_databases]]
binding = "DB"
database_name = "halokantor-pricing"
database_id = "d1d9be2b-db8b-4b76-84b8-dba6807e7e3d"
migrations_dir = "migrations"

[assets]
directory = "./dist/client"
not_found_handling = "single-page-application"
binding = "ASSETS"
# Every request is routed through the Worker first (not just /api/*) so that
# secureHeaders (CSP, HSTS, X-Frame-Options, X-Content-Type-Options) applies
# to the HTML/JS/CSS the browser actually loads, not only to JSON API
# responses. Non-API requests fall through to ASSETS.fetch() in index.ts.
run_worker_first = true

[vars]
NODE_ENV = "production"
APP_URL = "https://pricing.salvator.co.id"

# Brute-force protection: Workers isolates have no shared in-memory counter,
# so login/password attempts and the AI assistant are throttled through
# Cloudflare's edge-native Rate Limiting binding instead of express-rate-limit.
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "ASSISTANT_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# Blanket throttle for the whole /api/* surface, keyed per client IP — mirrors
# the Express dev backend's global express-rate-limit(600/min) so an
# authenticated-but-abusive or compromised account can't hammer D1 unchecked.
[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1003"
simple = { limit = 600, period = 60 }
